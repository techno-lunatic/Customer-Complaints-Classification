<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Complaint Classifier</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <h1>Consumer Complaint Classifier</h1>
        <p class="intro">
            Enter a financial complaint below. The model will predict its category.
        </p>

        <label for="complaint">Complaint narrative</label>
        <textarea id="complaint"
            placeholder="Example: I was charged fees on my credit card that I did not authorize..."></textarea>

        <button id="predictButton" onclick="predictComplaint()">
            Classify Complaint
        </button>

        <p id="message"></p>

        <section id="results" class="results hidden">
            <h2>Prediction results</h2>
            <div id="predictionList"></div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
