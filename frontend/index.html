<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumer Complaint Classifier</title>

  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
</head>
<body>
  <main class="page">
    <h1>Consumer Complaint Classifier</h1>
    <p>Enter a complaint to see which issue categories the model predicts.</p>

    <form id="complaint-form">
      <label for="complaint">Complaint text</label>
      <textarea
        id="complaint"
        rows="7"
        maxlength="10000"
        placeholder="Type or paste a complaint here"
        required
      ></textarea>

      <button id="submit-button" type="submit">Classify complaint</button>
    </form>

    <p id="message" role="status"></p>

    <section id="results" hidden>
      <h2>Predicted issue categories</h2>
      <ol id="prediction-list"></ol>
    </section>
  </main>
</body>
</html>
